name: Unzip
on: push
jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Unzip
        run: |
          unzip web.zip
          rm -rf web.zip _MACOSX
      - name: Commit
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .
          git commit -m "unzipped"
          git push
